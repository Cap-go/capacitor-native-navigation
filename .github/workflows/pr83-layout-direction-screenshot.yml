name: PR83 layout direction screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture_pr83_android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Restore Android emulator cache
        uses: actions/cache/restore@v5
        id: emulator-cache
        with:
          path: |
            /usr/local/lib/android/sdk/system-images
            ~/.android/avd
          key: android-emulator-api-34-google-apis-x86_64-pixel6-v3
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 666 /dev/kvm || true
          fi
      - name: Start virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
      - name: Capture PR83 Android tab bar screenshots
        env:
          DISPLAY: :99
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          profile: pixel_6
          emulator-boot-timeout: 1200
          force-avd-creation: ${{ steps.emulator-cache.outputs.cache-hit != 'true' }}
          disable-animations: true
          emulator-options: -no-window -gpu auto -noaudio -no-boot-anim -camera-back none
          script: bash -lc 'chmod +x .github/scripts/capture-pr83-android-tabbar-screenshots.sh && timeout 3000 .github/scripts/capture-pr83-android-tabbar-screenshots.sh'
      - name: Upload PR83 screenshot artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pr83-android-tabbar-screenshots
          path: docs/screenshots/pr-83/android-*.png
          if-no-files-found: error
