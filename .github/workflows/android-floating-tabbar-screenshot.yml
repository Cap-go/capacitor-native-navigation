name: Android floating tabbar screenshot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'example-app/**'
      - '.github/workflows/android-floating-tabbar-screenshot.yml'
      - '.github/scripts/optimize-tabbar-screenshot.py'
      - '.github/scripts/capture-floating-tabbar-screenshot.sh'
      - '.github/scripts/verify-tabbar-screenshot.py'
  push:
    branches:
      - cursor/android-floating-tabbar-glass

permissions:
  contents: read
  actions: write

jobs:
  build_apks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install dependencies
        run: |
          bun i
          cd example-app && bun i
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: zulu
          java-version: 21
      - name: Build plugin and screenshot example app
        run: |
          bun run build
          cd example-app
          VITE_SCREENSHOT_MODE=floating-tabbar bun run build
          bunx cap sync android
      - name: Assemble debug APK
        run: |
          cd example-app/android
          chmod +x gradlew
          VITE_SCREENSHOT_MODE=floating-tabbar ./gradlew :app:assembleDebug --no-daemon
      - name: Stage APK for capture
        run: |
          mkdir -p screenshot-apks
          cp example-app/android/app/build/outputs/apk/debug/app-debug.apk screenshot-apks/
      - name: Upload screenshot APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-floating-tabbar-apk
          path: screenshot-apks/app-debug.apk
          if-no-files-found: error

  capture_emulator:
    needs: build_apks
    if: github.event_name != 'pull_request'
    runs-on: macos-14
    # API 34 emulator boot plus install verification can exceed 10 minutes on a cold runner.
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore Android emulator cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: emulator-cache
        with:
          path: |
            /usr/local/lib/android/sdk/system-images
            ~/.android/avd
          key: android-emulator-api-34-google-apis-x86_64-v1
      - name: Download screenshot APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-floating-tabbar-apk
          path: screenshot-apks
      - name: Capture floating tabbar on emulator
        id: emulator_capture
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 1
          ram-size: 4096M
          emulator-boot-timeout: 1200
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash -lc 'chmod +x .github/scripts/capture-floating-tabbar-screenshot.sh && .github/scripts/capture-floating-tabbar-screenshot.sh screenshot-apks/app-debug.apk "${GITHUB_WORKSPACE}/android-floating-tabbar-after-full.png"'
      - name: Save Android emulator cache
        if: steps.emulator_capture.outcome == 'success' && steps.emulator-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            /usr/local/lib/android/sdk/system-images
            ~/.android/avd
          key: android-emulator-api-34-google-apis-x86_64-v1
      - name: Setup Python
        if: steps.emulator_capture.outcome == 'success'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify screenshot content
        if: steps.emulator_capture.outcome == 'success'
        run: |
          python -m pip install pillow
          python .github/scripts/verify-tabbar-screenshot.py android-floating-tabbar-after-full.png
      - name: Resize and optimize screenshot
        if: steps.emulator_capture.outcome == 'success'
        run: |
          python -m pip install pillow
          python .github/scripts/optimize-tabbar-screenshot.py
          python .github/scripts/verify-tabbar-screenshot.py docs/android-floating-tabbar-after-300.png
          cp android-floating-tabbar-after-full.png docs/android-floating-tabbar-after-full.png
      - name: Upload failed capture debug image
        if: failure() && steps.emulator_capture.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-floating-tabbar-capture-debug
          path: android-floating-tabbar-capture-debug.png
          if-no-files-found: ignore

      - name: Upload screenshot artifacts
        if: steps.emulator_capture.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-floating-tabbar-screenshot
          path: |
            android-floating-tabbar-after-full.png
            docs/android-floating-tabbar-after-300.png
            docs/android-floating-tabbar-after-full.png
          if-no-files-found: error
