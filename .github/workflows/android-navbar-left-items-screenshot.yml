name: Android navbar left items screenshot

concurrency:
  group: android-navbar-left-items-screenshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'example-app/**'
      - '.github/workflows/android-navbar-left-items-screenshot.yml'
      - '.github/scripts/capture-navbar-left-items-screenshot.sh'
      - '.github/scripts/capture-navbar-left-items-screenshots-in-ci.sh'
      - 'docs/screenshots/navbar-left-items/**'

permissions:
  contents: read

jobs:
  build_apks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun i
          cd example-app && bun i
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - name: Build plugin
        run: bun run build
      - name: Build screenshot APKs
        run: |
          set -euo pipefail
          mkdir -p screenshot-apks
          sync_installed_android_sources() {
            local mode="$1"
            local installed_root
            installed_root="$(find example-app/node_modules -type d -path '*/@capgo/capacitor-native-navigation/android/src/main/java/app/capgo/nativenavigation' -print -quit)"
            test -n "${installed_root}"
            if [ "${mode}" = "main" ]; then
              git ls-tree --name-only "origin/main:android/src/main/java/app/capgo/nativenavigation" | while read -r name; do
                git show "origin/main:android/src/main/java/app/capgo/nativenavigation/${name}" > "${installed_root}/${name}"
              done
              for file in "${installed_root}"/*.java; do
                [ -e "${file}" ] || continue
                base="$(basename "${file}")"
                if ! git cat-file -e "origin/main:android/src/main/java/app/capgo/nativenavigation/${base}" 2>/dev/null; then
                  rm -f "${file}"
                fi
              done
            else
              local staging_dir
              staging_dir="$(mktemp -d)"
              git ls-tree --name-only "HEAD:android/src/main/java/app/capgo/nativenavigation" | while read -r name; do
                git show "HEAD:android/src/main/java/app/capgo/nativenavigation/${name}" > "${staging_dir}/${name}"
              done
              for file in "${staging_dir}"/*.java; do
                [ -e "${file}" ] || continue
                cp -f "${file}" "${installed_root}/$(basename "${file}")"
              done
              for file in "${installed_root}"/*.java; do
                [ -e "${file}" ] || continue
                base="$(basename "${file}")"
                if ! git cat-file -e "HEAD:android/src/main/java/app/capgo/nativenavigation/${base}" 2>/dev/null; then
                  rm -f "${file}"
                fi
              done
              rm -rf "${staging_dir}"
            fi
            git checkout HEAD -- android/src/main/java/app/capgo/nativenavigation/ 2>/dev/null || true
          }
          build_apk() {
            local android_source_mode="$1"
            local apk_out="$2"
            sync_installed_android_sources "${android_source_mode}"
            bun run build
            cd example-app
            VITE_SCREENSHOT_MODE=navbar-left-items bun run build
            VITE_SCREENSHOT_MODE=navbar-left-items bunx cap sync android
            cd android
            chmod +x gradlew
            VITE_SCREENSHOT_MODE=navbar-left-items ./gradlew :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../../${apk_out}"
            cd ../..
          }
          git fetch origin main
          build_apk main screenshot-apks/navbar-before.apk
          build_apk head screenshot-apks/navbar-after.apk
      - name: Upload screenshot APKs
        uses: actions/upload-artifact@v7
        with:
          name: navbar-left-items-apks
          path: screenshot-apks/*.apk
          if-no-files-found: error

  capture:
    needs: build_apks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download screenshot APKs
        uses: actions/download-artifact@v8
        with:
          name: navbar-left-items-apks
          path: screenshot-apks
      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 666 /dev/kvm || true
          fi
      - name: Capture before and after navbar screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu auto -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/capture-navbar-left-items-screenshots-in-ci.sh
      - name: Upload navbar screenshot pair
        uses: actions/upload-artifact@v7
        with:
          name: navbar-left-items-screenshots
          path: docs/screenshots/navbar-left-items/*.png
          if-no-files-found: error
